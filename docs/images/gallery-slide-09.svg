  <text font-family="Calibri" font-size="18.7" fill="#111827" text-anchor="start" ><tspan x="80.6" y="437.7">Downstream accuracy is high while feature recovery remains low.</tspan></text>
  <rect x="59.5" y="501.1" width="661.7" height="109.4" rx="10.6" fill="#EAF1FE" stroke="#2563EB" stroke-width="1.47"/>
  <text font-family="Calibri" font-size="13.3" fill="#2563EB" text-anchor="start" font-weight="700" ><tspan x="80.6" y="527.7">INTERPRETATION</tspan></text>
  <text font-family="Calibri" font-size="18.7" fill="#111827" text-anchor="start" ><tspan x="80.6" y="556.7">A downstream-valid pre-image that is not the true future feature</tspan><tspan x="80.6" y="579.8">may be sufficient.</tspan></text>
