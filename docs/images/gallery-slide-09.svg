  <text font-family="Consolas" font-size="20.0" fill="#111827" text-anchor="start" ><tspan x="80.6" y="319.8">linear probe R^2 for recovering Z_d from the corrected</tspan><tspan x="80.6" y="344.6">feature = 0.34; downstream accuracy = 0.91</tspan></text>
