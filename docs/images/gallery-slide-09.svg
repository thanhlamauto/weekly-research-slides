  <text font-family="Calibri" font-size="16.0" fill="#374151" text-anchor="start" ><tspan x="777.2" y="316.2">Output recovery can occur without strong feature</tspan><tspan x="777.2" y="336.0">recovery in this setup.</tspan></text>
  <rect x="756.1" y="382.1" width="464.4" height="109.4" rx="10.6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.47"/>
