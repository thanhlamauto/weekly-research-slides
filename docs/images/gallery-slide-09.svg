  <text font-family="Calibri" font-size="16.0" fill="#374151" text-anchor="start" ><tspan x="777.2" y="435.2">That no valid feature recovery exists, or that the</tspan><tspan x="777.2" y="455.0">probe is a complete measurement.</tspan></text>
  <rect x="756.1" y="501.1" width="464.4" height="109.4" rx="10.6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.47"/>
