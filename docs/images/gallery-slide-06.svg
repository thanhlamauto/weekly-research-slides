  <text font-family="Calibri" font-size="12.7" fill="#6B6B6B" text-anchor="start" ><tspan x="86.4" y="389.3">Observation</tspan></text>
  <text font-family="Calibri" font-size="18.0" fill="#1A1A1A" text-anchor="start" ><tspan x="86.4" y="416.9">The correction direction is nearly orthogonal to the direction from</tspan><tspan x="86.4" y="439.2">the cached feature to the future feature.</tspan></text>
  <rect x="69.1" y="498.2" width="650.8" height="124.8" rx="2.9" fill="#F6F6F4" stroke="none" stroke-width="1.33"/>
  <rect x="69.1" y="498.2" width="3.4" height="124.8" rx="0.0" fill="#245B78" stroke="none" stroke-width="1.33"/>
  <text font-family="Calibri" font-size="12.7" fill="#245B78" text-anchor="start" ><tspan x="86.4" y="525.6">Interpretation</tspan></text>
  <text font-family="Calibri" font-size="18.0" fill="#1A1A1A" text-anchor="start" ><tspan x="86.4" y="553.2">Output recovery may not require moving toward the exact future</tspan><tspan x="86.4" y="575.5">hidden state.</tspan></text>
  <rect x="754.2" y="225.6" width="456.7" height="124.8" rx="2.9" fill="#F6F6F4" stroke="none" stroke-width="1.33"/>
  <rect x="754.2" y="225.6" width="3.4" height="124.8" rx="0.0" fill="#2F6B4F" stroke="none" stroke-width="1.33"/>
  <text font-family="Calibri" font-size="12.7" fill="#2F6B4F" text-anchor="start" ><tspan x="771.4" y="252.9">Can conclude</tspan></text>
  <text font-family="Calibri" font-size="15.3" fill="#3A3A3A" text-anchor="start" ><tspan x="771.4" y="278.1">C1 as stated is not supported; the correction is not</tspan><tspan x="771.4" y="297.1">simply moving toward Z_d.</tspan></text>
  <rect x="754.2" y="361.9" width="456.7" height="124.8" rx="2.9" fill="#F6F6F4" stroke="none" stroke-width="1.33"/>
  <rect x="754.2" y="361.9" width="3.4" height="124.8" rx="0.0" fill="#9E3B32" stroke="none" stroke-width="1.33"/>
  <text font-family="Calibri" font-size="12.7" fill="#9E3B32" text-anchor="start" ><tspan x="771.4" y="389.3">Cannot conclude</tspan></text>
  <text font-family="Calibri" font-size="15.3" fill="#3A3A3A" text-anchor="start" ><tspan x="771.4" y="414.4">That the correction is uninformative, or that the</tspan><tspan x="771.4" y="433.4">method fails.</tspan></text>
  <rect x="754.2" y="498.2" width="456.7" height="124.8" rx="2.9" fill="#F6F6F4" stroke="none" stroke-width="1.33"/>
