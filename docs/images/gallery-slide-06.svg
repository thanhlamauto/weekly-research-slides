  <rect x="69.1" y="225.6" width="3.4" height="124.8" rx="0.0" fill="#3A3A3A" stroke="none" stroke-width="1.33"/>
  <text font-family="Calibri" font-size="12.7" fill="#3A3A3A" text-anchor="start" ><tspan x="86.4" y="252.9">Measurement</tspan></text>
  <text font-family="Consolas" font-size="24.0" fill="#1A1A1A" text-anchor="start" ><tspan x="86.4" y="286.1">cos(deltaZ, Z_d - Z_s) = 0.1168</tspan></text>
  <rect x="69.1" y="361.9" width="650.8" height="124.8" rx="2.9" fill="#F6F6F4" stroke="none" stroke-width="1.33"/>
