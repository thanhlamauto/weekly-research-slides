  <text font-family="Calibri" font-size="12.7" fill="#6B6B6B" text-anchor="start" ><tspan x="771.4" y="525.6">Alternative targeted</tspan></text>
  <text font-family="Calibri" font-size="15.3" fill="#3A3A3A" text-anchor="start" ><tspan x="771.4" y="550.7">The correction may exploit a downstream-valid direction</tspan><tspan x="771.4" y="569.8">that is not the future-feature direction.</tspan></text>
