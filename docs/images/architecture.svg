<svg xmlns="http://www.w3.org/2000/svg" width="1982" height="300" viewBox="0 0 1982 300"><rect width="1982" height="300" fill="#FFFFFF"/><text x="60" y="66" font-family="Helvetica, Arial" font-size="30" font-weight="700" fill="#1A1A1A">Source-first pipeline</text><text x="60" y="98" font-family="Helvetica, Arial" font-size="18" fill="#6B6B6B">Structured source is the truth. Fix the source and rebuild; never patch the generated PPTX.</text><rect x="60" y="130" width="210" height="84" rx="6" fill="#F6F6F4" stroke="#6B6B6B" stroke-width="2"/><text x="165" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">research_state.yaml</text><line x1="270" y1="172" x2="296" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="296" y="130" width="210" height="84" rx="6" fill="#F6F6F4" stroke="#6B6B6B" stroke-width="2"/><text x="401" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">+ weekly material</text><line x1="506" y1="172" x2="532" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="532" y="130" width="210" height="84" rx="6" fill="#EAF1F4" stroke="#245B78" stroke-width="2"/><text x="637" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">weekly_delta.yaml</text><line x1="742" y1="172" x2="768" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="768" y="130" width="210" height="84" rx="6" fill="#EAF1F4" stroke="#245B78" stroke-width="2"/><text x="873" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">storyboard.yaml</text><line x1="978" y1="172" x2="1004" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="1004" y="130" width="210" height="84" rx="6" fill="#EAF1F4" stroke="#245B78" stroke-width="2"/><text x="1109" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">slide_spec.yaml</text><line x1="1214" y1="172" x2="1240" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="1240" y="130" width="210" height="84" rx="6" fill="#E9F1EC" stroke="#2F6B4F" stroke-width="2"/><text x="1345" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">editable PPTX</text><line x1="1450" y1="172" x2="1476" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="1476" y="130" width="210" height="84" rx="6" fill="#F6EDE3" stroke="#A1602A" stroke-width="2"/><text x="1581" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">+ optional motion</text><line x1="1686" y1="172" x2="1712" y2="172" stroke="#9B9B9B" stroke-width="3" marker-end="url(#m)"/><rect x="1712" y="130" width="210" height="84" rx="6" fill="#EDEAF4" stroke="#5B4B8A" stroke-width="2"/><text x="1817" y="179" font-family="Helvetica, Arial" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">render + QA</text><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9B9B9B"/></marker></defs><text x="60" y="262" font-family="Helvetica, Arial" font-size="16" fill="#6B6B6B">read delta -> plan -> author -> build -> QA -> rebuild</text></svg>