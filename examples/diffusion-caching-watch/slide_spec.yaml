  - id: cw14
    archetype: limitations
    module: limitation
    title: What we still do not know
    content:
      limitations:
        - LinCa is profiled from its paper only; we have not reproduced it in our matched setting.
        - Our runs cover one model (FLUX) and one prompt set, so cross-model ranking is unmeasured.
        - PSNR/SSIM against Original FLUX penalise every accelerator; they are fidelity, not quality.
        - N=25 is a failure regime for all three methods, so the interval range where learned corrections pay off is still narrow.
      open_questions:
        - Does LinCa's learned decomposition close the N=10-25 gap that no current method survives?
        - Is the CLIP advantage of LearniBridge-100 at N=7/10 reproducible across prompt sets?
        - Would a data-dependent schedule change which of these competitors wins?
    beats: [limitations, open-questions]
    notes: >-
      End here. The next action is a LinCa reproduction in the same matched
      harness; no thank-you slide.
