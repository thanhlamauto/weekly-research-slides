" stroke="#2563EB" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="660.0" y="441.9">Learned router</tspan></text><rect x="751.0" y="412.2" width="150.0" height="54.0" rx="6" fill="#E0E9FC" stroke="#2563EB" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="826.0" y="441.9">Budget controller</tspan></text><rect x="917.0" y="412.2" width="150.0" height="54.0" rx="6" fill="#EAEBED" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="992.0" y="441.9">Decoder</tspan></text><rect x="1083.0" y="417.2" width="128.0" height="44.0" rx="6" fill="#F0F1F2" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="1147.0" y="441.9">answer tokens</tspan></text><text font-family="Arial" font-size="8" fill="#374151" font-weight="400" text-anchor="start"><tspan x="271.0" y="103.5">For a given query, only a few context tokens carry most of</tspan><tspan x="271.0" y="113.8">the relevant signal.</tspan></text><text font-family="Arial" font-size="8" fill="#374151" font-weight="400" text-anchor="start"><tspan x="520.0" y="359.5">Query difficulty is predictable from the query embedding, so</tspan><tspan x="520.0" y="369.8">the budget can be learned.</tspan></text><path d="M 320.0 153.2 L 328.0 153.2 L 328.0 183.2 L 336.0 183.2" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arw-374151)"/><path d="M 320.0 213.2 L 328.0 213.2 L 328.0 183.2 L 336.0 183.2" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arw-374151)"/><path d="M 486.0 183.2 L 502.0 183.2" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arw-374151)"/><path d="M 652.0 183.2 L 668.0 183.2" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arw