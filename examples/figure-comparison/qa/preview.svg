<svg xmlns="http://www.w3.org/2000/svg" width="1320.0" height="640.0" viewBox="0 0 1320.0 640.0"><rect width="1320.0" height="640.0" fill="#FFFFFF"/><defs><marker id="arw-374151" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs><text font-family="Arial" font-size="15" fill="#374151" font-weight="700" text-anchor="start"><tspan x="26.0" y="40.7">Static Top-K vs BAR (ours)</tspan></text><rect x="26.0" y="60.0" width="1268.0" height="232.0" rx="6" fill="#FDF7F0" stroke="#D97706" stroke-width="1.0" stroke-dasharray="6 4"/><text x="36.0" y="78.0" font-family="Arial" font-size="9" font-weight="700" fill="#D97706">Static Top-K</text><rect x="26.0" y="316.0" width="1268.0" height="232.0" rx="6" fill="#F2F6FE" stroke="#2563EB" stroke-width="1.0" stroke-dasharray="6 4"/><text x="36.0" y="334.0" font-family="Arial" font-size="9" font-weight="700" fill="#2563EB">BAR (ours)</text><rect x="192.0" y="131.2" width="128.0" height="44.0" rx="6" fill="#F0F1F2" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="256.0" y="155.9">query tokens</tspan></text><rect x="192.0" y="191.2" width="128.0" height="44.0" rx="6" fill="#F0F1F2" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="256.0" y="215.9">cached context keys</tspan></text><rect x="336.0" y="156.2" width="150.0" height="54.0" rx="6" fill="#EAEBED" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="middle"><tspan x="411.0" y="185.9">Backbone encoder</tspan></text><rect x="502.0" y="156.2" width="150.0" height="54.0" rx="6" fill="#EAEBED" stroke="#6B7280" stroke-width="1.1"/><text font-family="Arial" font-size="9.5" fill="#374151" font-weight="600" text-anchor="mid