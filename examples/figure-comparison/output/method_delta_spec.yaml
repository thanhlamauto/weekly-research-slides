  panel: mechanism
  role: shared
  column: 1
  order: 0
- id: C_index
  semantic_id: component.index
  type: learned-module
  label: Similarity index
  detail: cosine similarity over cached keys
  panel: mechanism
  role: shared
  column: 2
  order: 1
- id: C_router
  semantic_id: component.router
  type: learned-module
  label: Learned router
  detail: predicts query difficulty
