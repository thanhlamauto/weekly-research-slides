figure:
  id: method_delta
  type: method-delta
  mode: delta
  title: 'Budget-Aware Retrieval: change this week'
  purpose: Keep unchanged components in place, mute them, and highlight only what
    changed.
  style: topconf-clean
panels:
- id: mechanism
  label: Current method
  role: ours
nodes:
- id: C_input_1
  semantic_id: input.1
  type: input
  label: query tokens
  panel: mechanism
  column: 0
  order: 0
  role: shared
- id: C_input_2
