  - id: lb15
    archetype: limitations
    module: limitation
    title: Limitations and open questions
    content:
      limitations:
        - Calibration is not free: it needs a pre-calibration pass over full trajectories plus a LoRA finetune, even if only on a few prompts.
        - Only the final Transformer block is calibrated, so the bridge has to absorb the shift of every bypassed block.
        - Rank is a design choice. The ablation peaks around r=64 and degrades at larger ranks.
        - The low-rank and prompt-invariance findings are empirical measurements on the tested models and prompt sets.
      open_questions:
        - Does the shared low-rank structure survive other backbones, modalities and layer choices?
        - Can the pre-calibration pass be replaced by data collected during normal inference?
        - How does the bridge combine with step distillation, quantization or other caching schedules?
    beats: [limitations, open-questions]
    notes: >-
      End here. No thank-you slide and no leaderboard summary: the mechanism was
      the point, and the limitations are where the discussion starts.
