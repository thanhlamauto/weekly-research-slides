        - name: TeaCache (delta=1.4)
          role: competitor
          values: { speedup: 5.99, ir: 0.7252, clip: 0.8026, psnr: 26.5802, ssim: 0.6338 }
        - name: TaylorSeer (N=8, O=2)
          role: competitor
          values: { speedup: 6.10, ir: 0.8212, clip: 0.8041, psnr: 26.8228, ssim: 0.6750 }
        - name: LearniBridge (N=8)
          role: current
          role_label: ours
          values: { speedup: 6.17, ir: 0.8308, clip: 0.8164, psnr: 28.3464, ssim: 0.6870 }
