# Renderable source for the LearniBridge paper explainer (Beamer default).
#
# Paper: "LearniBridge: Learnable Calibration of Feature Caching for Diffusion
# Models Acceleration". Xuyue Huang, Zhe Chen, Wang Shen, Xiao-Ping Zhang.
# arXiv:2606.26778 (25 Jun 2026), ICML 2026. Read from the paper; this deck is an
# independent explanation, no endorsement by the authors is implied.
#
# Every number on the benchmark slides is taken from the paper's tables. Slides
# separate measurement, observation and interpretation on purpose: the low-rank
# and prompt-invariance findings are empirical, not universal laws.
deck:
  title: LearniBridge
  subtitle: Learnable calibration of feature caching for diffusion models
  project: LearniBridge
  stage: survey
  week: 1
  audience: Adjacent-researcher paper reading group
  familiarity: medium
  footer: LearniBridge · Huang, Chen, Shen & Zhang · ICML 2026 · independent explainer
  this_week_question: What correction makes a cached computation behave like the skipped full computation?

slides:
  - id: lb01
    archetype: title
    title: LearniBridge
    content:
      project: LearniBridge
      headline: What correction makes a cached computation behave like the skipped full computation?
      question: Paper explainer · arXiv:2606.26778 · ICML 2026 · an independent redrawing of the mechanism, not a reproduction of the paper's figures
      byline: Huang, Chen, Shen & Zhang · ICML 2026
    beats: [paper, question]
    notes: >-
      This is a method explainer, not a leaderboard review. The whole deck answers
      one question: what does the correction have to look like for cache reuse to
      survive long skips?

  - id: lb02
    archetype: problem
    module: problem
    title: Feature caching buys speed by skipping blocks
    content:
      summary: A Diffusion Transformer evaluates a deep network at every denoising step. Feature caching reuses a representation computed at an earlier step so later steps can skip expensive blocks.
      why_hard:
        - The reused feature is stale. It was computed for a different timestep, so it carries the wrong content.
        - The same approximation is applied at every skipped step, and the error compounds along the trajectory.
        - The problem grows exactly where the win is. The longer the cache interval, the larger the drift and the larger the speedup.
      constraints:
        - The backbone stays as it is. No architectural change and no retraining of the base model.
        - The calibration budget must be small, a handful of prompts rather than a finetune.
        - Skipped steps must stay cheap, otherwise the speedup is spent on the fix.
    beats: [cost, staleness, constraints]
    notes: >-
      Establish the trade-off before any architecture. Caching is attractive
      because it is model-agnostic and needs no training, and that is exactly the
      property a fix should preserve.

  - id: lb03
    archetype: competitor-mechanism
    module: competitor-method
    title: Existing methods forecast from history
    content:
      intuition: Nearby steps produce similar features, so an earlier feature stands in well.
      mechanism: 'Cache the block output at a reference step, then approximate skipped steps from history: reuse (DeepCache, FORA) or Taylor extrapolation (TaylorSeer).'
      module_label: cache + forecast
      failure:
        - A fixed rule cannot track how the representation changes away from the reference step.
        - TaylorSeer assumes smooth, high-order differentiable trajectories.
        - At high acceleration the error accumulates.
      relation_to_us: Keep the schedule; replace the rule with a learned, structured correction.
    beats: [intuition, mechanism, failure]
    notes: >-
      Keep the baselines compressed to one idea each. The point is not the
      catalogue but the shared assumption, a fixed rule over historical features.

  - id: lb04
    archetype: motivation
    module: motivation
    title: Change the question, learn the correction
    content:
      contrast:
        old_label: The usual question
        old: Predict the future feature from historical features with a fixed rule, and hope the prediction is close.
        new_label: LearniBridge asks
        new: What correction is required for the cached computation to reproduce the skipped full computation?
      idea: Model the required change directly and constrain it. The cached input times a low-rank correction approximates the future full-computation output.
      why_now: If the required correction has exploitable structure, a few calibration prompts are enough and the correction is nearly free at inference.
    beats: [old, new, idea]
    notes: >-
      This is the pivot of the paper. Forecasting works in feature space and
      guesses forward; LearniBridge asks what change in the computation is needed
      to land on the true output.

  - id: lb05
    archetype: feature-space
    module: method-high-level
    title: What correction is actually required
    content:
      nodes:
        - { object_id: lb-cached, label: X, kind: feature, cx: 2.7, cy: 4.1, sublabel: cached input, step t }
        - { object_id: lb-reuse, label: 'F~', kind: feature, cx: 5.4, cy: 2.1, sublabel: output if we just reuse it }
        - { object_id: lb-target, label: F, kind: feature, cx: 8.4, cy: 3.9, sublabel: true output, step t-k }
      vectors:
        - { id: lb-vec-reuse, from: lb-cached, to: lb-reuse, semantic: reference, label: reuse, no correction }
        - { id: lb-vec-e, from: lb-reuse, to: lb-target, semantic: vector, label: residual E }
      legend_items:
        - { label: 'residual E: what the correction must explain', semantic: vector }
        - { label: 'reuse path, with no correction', semantic: reference }
      note: >-
        Over many prompts the paper writes the residuals as a matrix E and the
        cached inputs as a matrix X, and models E ≈ ΔW · X. The geometry above is
        in feature space; the correction ΔW itself acts on layer weights.
    beats: [objects, residual, model]
    notes: >-
      Keep the three objects on screen. X is one cached input, F~ is what reuse
      returns, F is what full computation would have returned. The correction is
      defined by that gap, and the next slide asks what shape the gap has.

  - id: lb06
    archetype: diagnostic
    module: diagnostic
    title: 'Diagnostic D1: is the required correction low-rank?'
    citation: Huang et al., ICML 2026, §3.2 and Figure 1
    content:
      id: D1
      question: Does the optimal calibration update have exploitable structure?
      claim_ids: [C1]
      measurement: 'Singular values of X (100 prompts) decay rapidly. Fit E ≈ ΔW · X: ΔW = E · pinv(X), rank(ΔW) ≤ rank(X) ≤ r'
      observation: Spectral energy concentrates in a few principal directions, so the least-squares correction is low rank.
      interpretation: A low-rank parameterization can represent the required correction; no full-rank update is needed.
      can_conclude: Under the paper's model E ≈ ΔW · X, the optimal ΔW is low-rank in the authors' setting.
      cannot_conclude: That diffusion features are low-rank in general, or that the bound holds for every layer and model.
      alternative_explanation: The decay may partly reflect the chosen layer and prompt pool; this is empirical, not universal.
    beats: [measurement, observation, interpretation, bounds]
    notes: >-
      Walk the bands in order. The measurement is the SVD and the least-squares
      solution; the observation is the concentration of spectral energy; the
      interpretation is that low rank is a usable parameterization. The bound
      rank(ΔW) ≤ rank(X) is a consequence of the paper's model, not a theorem
      about diffusion models.

  - id: lb07
    archetype: diagnostic
    module: diagnostic
    title: 'Diagnostic D2: is the correction shared across prompts?'
    citation: Huang et al., ICML 2026, Figure 2
    content:
      id: D2
      question: Does the required correction depend on the prompt?
      claim_ids: [C1]
      measurement: 'Fit ΔW on each of 20 disjoint prompt groups; compare principal subspaces pairwise: the angles are small.'
      observation: Different prompt groups need nearly the same correction subspace.
      interpretation: The pattern is stable enough that calibration from a few prompts transfers.
      can_conclude: In the tested setting, subspaces from disjoint prompt groups coincide.
      cannot_conclude: That every prompt needs the same correction, or that invariance survives a domain shift.
      alternative_explanation: The groups came from one prompt pool, which may inflate their similarity.
    beats: [measurement, observation, interpretation, bounds]
    notes: >-
      This is the evidence behind the 3-5 prompt calibration budget. Be precise:
      small principal-subspace angles, not identical corrections, and measured on
      a shared prompt pool.

  - id: lb08
    archetype: method-high-level
    module: method-high-level
    title: Low rank suggests a LoRA bridge on the final block
    content:
      stages:
        - { label: cached input, role: input, detail: 'the final-block input recorded at the last full step' }
        - { label: 'final block + ΔW = BA', role: learned, detail: 'LoRA on Q, K, V, O, W1, W2 of block L; the base weights stay frozen' }
        - { label: calibrated output, role: output, detail: 'approximates the full computation at the skipped step' }
      note: >-
        Low rank is not an extra constraint here: LoRA is exactly a low-rank
        parameterization, ΔW = BA with r far below the layer dimensions. The only
        trainable parameters are the two small factors A and B.
    beats: [input, learned, output]
    notes: >-
      Make the design follow from the evidence: the analysis says the update is
      low rank, LoRA is the natural way to parameterize a low-rank update, so the
      adapter is a consequence rather than a fashion choice.

  - id: lb09
    archetype: recap
    module: experiment-setup
    title: 'Calibration: one full pass, then only the adapters train'
    content:
      established_title: 'A. Pre-calibration pass (full computation)'
      established:
        - { label: 'Record input.', detail: 'At each full-computation step t, keep the final-block input.' }
        - { label: 'Record target.', detail: 'At the steps that will be skipped, keep the true final-block output.' }
      now_title: 'B. LoRA finetune (only the adapters train)'
      now: The LoRA-augmented final block must turn the cached input into that recorded target, while every base weight stays frozen.
      prior_week: 'Budget reported in the paper: 3-5 calibration prompts, small rank, no backbone finetuning.'
    beats: [records, training]
    notes: >-
      Be honest about the cost: calibration needs a pre-calibration pass at full
      computation, so the training data is not free, it is just small. The
      ablation shows performance saturating beyond about five prompts.

  - id: lb10
    archetype: method-high-level
    module: method-high-level
    title: 'Inference: skip the blocks, run the bridge'
    content:
      stages:
        - { label: full step, role: cache, detail: 'every N steps: run all blocks and cache the final-block input' }
        - { label: skipped step, role: model, detail: 'blocks g1 to gL-1 are bypassed; no computation is spent there' }
        - { label: LoRA final block, role: learned, detail: 'only the last block runs, corrected by the low-rank bridge' }
      note: >-
        This is the whole acceleration: full computation every N steps, one
        calibrated block in between. The bridge is not run through every block.
    beats: [full, skipped, bridge]
    notes: >-
      Say the negative explicitly, because it is a common misreading: the adapters
      live in the final block only, and the earlier blocks do not run at all at
      skipped steps.

